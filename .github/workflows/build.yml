
name: Build PACHA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o PACHA_Proyecto_con_compilacion_nube.zip -d pacha-source
          find pacha-source -name gradlew -type f -exec chmod +x {} \;

      - name: Build APK
        working-directory: pacha-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PACHA-APK
          path: pacha-source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
