
name: Build PACHA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -o PACHA_Proyecto_con_compilacion_nube.zip -d pacha-source
          find pacha-source -name gradlew -type f -exec chmod +x {} \;

      -       - name: Inspect project
        run: |
          echo "=== Carpetas extraídas ==="
          find pacha-source -maxdepth 5 -type d
          echo "=== Archivos Gradle ==="
          find pacha-source -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name gradlew \)
      - name: Build APK
        working-directory: pacha-source/PachaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PACHA-APK
          path: pacha-source/PachaAndroid/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

