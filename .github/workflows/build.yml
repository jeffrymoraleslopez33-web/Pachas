
name: Build PACHA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o PACHA_Proyecto_con_compilacion_nube.zip -d pacha-source

      - name: Inspect project
        run: |
          echo "=== Carpetas extraídas ==="
          find pacha-source -maxdepth 5 -type d
          echo "=== Archivos Gradle ==="
          find pacha-source -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name gradlew \)

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find pacha-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "No se encontró la carpeta Gradle correcta. Revisa Inspect project."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PACHA-APK
          path: pacha-source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

